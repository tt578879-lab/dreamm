<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Trang chủ</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
}

.overlay {
    background-color: rgba(255,255,255,0.35);
    min-height: 100vh;
    padding: 40px 20px 90px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.company {
    padding: 10px;
    border: 1px solid rgba(0,0,0,0.3);
    text-align: center;
    text-decoration: none;
    color: red;
    font-weight: bold;
}

.company:hover {
    background-color: #f0f0f0;
}

/* ===== CHỮ CHẠY TRONG SUỐT TRÊN ẢNH NỀN ===== */
#runningText {
    position: fixed;
    bottom: 10px;          /* cách mép dưới một chút */
    left: 0;
    width: 100%;
    height: 30px;
    overflow: hidden;
    background: transparent;  /* QUAN TRỌNG */
    z-index: 999;
    pointer-events: none;     /* không che click */
}

#runningText span {
    position: absolute;
    left: 100%;
    white-space: nowrap;
    color: red;
    font-weight: bold;
    font-size: 16px;
    text-shadow: 1px 1px 3px #000; /* nổi trên ảnh */
    animation: runText 20s linear infinite;
}

@keyframes runText {
    from { left: 100%; }
    to   { left: -100%; }
}
</style>
</head>

<body>
