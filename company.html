        <tr>

            <th>Vị trí</th>

            <th>Phương thức</th>

            html += `
            <tr>
                <td>${n+1}</td>
                <td>${i.may}</td>
                <td>${i.seri}</td>
                <td>${i.ip}</td>
                <td>${i.vitri}</td>
                <td>${i.ngay}</td>
